interface:
  display_name: "Text Writer"
  short_description: "文書・Prompt・コピー用Queryを、目的と受け手に合わせて作成・改訂する"
  default_prompt: "$write-text を使い、現在の依頼・素材・Modeを保って、目的と受け手に合う文章へ整えてください。Skillを直接利用できない場合は、次の共有原本を全文読んで適用してください。取得できなければ、未確認範囲・影響・最小の回復方法を示してください。\nhttps://github.com/yusukefujiijp/ai-project/blob/main/skills/write-text/SKILL.md"
